name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · type-check · test · coverage)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:frontend

      - name: Type-check
        run: pnpm type-check

      - name: Test + coverage gate
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  rust:
    name: Rust (clippy · test)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-gnu
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (clippy -D warnings)
        run: pnpm lint:backend

      - name: Test
        run: cd src-tauri && cargo test --workspace

  backend-coverage:
    name: Core coverage (cargo-llvm-cov on Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt --component llvm-tools-preview
          rustup default stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Coverage (fail under 50% lines)
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --package mytools-core \
            --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lcov
          path: lcov.info
          retention-days: 7

  build:
    name: Build (tauri build --no-bundle)
    needs: [frontend, rust]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle

      - name: Stage runtime
        run: |
          New-Item -ItemType Directory -Force ci-app | Out-Null
          Copy-Item src-tauri/target/release/mytools.exe, src-tauri/resources/WebView2Loader.dll ci-app/

      - name: Upload release exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mytools-exe
          path: ci-app/*
          retention-days: 7

  e2e:
    name: E2E smoke (tauri-driver + wdio)
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download release exe
        uses: actions/download-artifact@v4
        with:
          name: mytools-exe
          path: dist

      - name: Install drivers
        run: |
          cargo install tauri-driver --locked
          $edge = Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $version = $edge.VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile driver.zip
          Expand-Archive driver.zip -DestinationPath driver
          (Resolve-Path driver).Path >> $env:GITHUB_PATH

      - run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        env:
          MYTOOLS_E2E_EXE: ${{ github.workspace }}\dist\mytools.exe
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=0"
          Start-Process tauri-driver -ArgumentList "--port","4440","--native-port","4441" -WindowStyle Hidden -PassThru | Out-Null
          Start-Sleep -Seconds 5
          pnpm test:e2e
