name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · type-check · test · coverage)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Runtime packaging regressions
        run: node --test scripts/webview2-runtime.test.mjs scripts/runtime-deps.test.mjs

      - name: Lint
        run: pnpm lint:frontend

      - name: Type-check
        run: |
          pnpm type-check
          if ($LASTEXITCODE -ne 0) { throw "Frontend type check failed" }
          pnpm type-check:e2e

      - name: Test + coverage gate
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  rust:
    name: Rust (clippy · test)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-gnu
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (clippy -D warnings)
        run: pnpm lint:backend

      - name: Test
        run: cd src-tauri && cargo test --workspace

  backend-coverage:
    name: Core coverage (cargo-llvm-cov on Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt --component llvm-tools-preview
          rustup default stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Coverage (fail under 50% lines)
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --package mytools-core \
            --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lcov
          path: lcov.info
          retention-days: 7

  build:
    name: Build (tauri build --no-bundle)
    needs: [frontend, rust]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle

      - name: Stage runtime
        run: |
          New-Item -ItemType Directory -Force ci-app | Out-Null
          Copy-Item src-tauri/target/release/mytools.exe, src-tauri/resources/WebView2Loader.dll ci-app/
          node scripts/check-runtime-deps.mjs ci-app/mytools.exe
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency check failed" }

      - name: Upload release exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mytools-exe
          path: ci-app/*
          retention-days: 7

  e2e:
    name: E2E smoke (tauri-driver + wdio)
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download release exe
        uses: actions/download-artifact@v4
        with:
          name: mytools-exe
          path: dist

      - name: Install drivers
        id: drivers
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri-driver installation failed" }
          $driver = & ./scripts/setup-e2e-driver.ps1 -ApplicationPath ./dist/mytools.exe -DriverDirectory ./driver
          "native_driver=$driver" >> $env:GITHUB_OUTPUT

      - run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        env:
          MYTOOLS_E2E_EXE: ${{ github.workspace }}\dist\mytools.exe
          MYTOOLS_E2E_ARTIFACTS: ${{ github.workspace }}\e2e-artifacts
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=0"
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "mytools-e2e-profile"
          New-Item -ItemType Directory -Force e2e-artifacts | Out-Null
          $driver = Start-Process tauri-driver -ArgumentList '--port','4440','--native-port','4441','--native-driver','"${{ steps.drivers.outputs.native_driver }}"' -RedirectStandardOutput e2e-artifacts/tauri-driver.log -RedirectStandardError e2e-artifacts/tauri-driver-error.log -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($driver.HasExited) { throw "tauri-driver exited before becoming ready" }
              try { Invoke-RestMethod http://127.0.0.1:4440/status -NoProxy -TimeoutSec 1 | Out-Null; $ready = $true; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "tauri-driver readiness timed out" }
            pnpm test:e2e
            if ($LASTEXITCODE -ne 0) { throw "E2E smoke failed (exit $LASTEXITCODE)" }
          } finally {
            if (-not $driver.HasExited) { Stop-Process -Id $driver.Id -Force }
          }

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: e2e-artifacts/
          retention-days: 7
