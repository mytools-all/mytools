<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>便签入门示例</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>便签</h1>
    <label for="note">内容（最多 20000 个 UTF-16 码元，部分字符占两个）</label>
    <textarea id="note" maxlength="20000" disabled placeholder="加载完成后在这里输入"></textarea>
    <div class="actions">
      <button id="save" type="button" disabled>保存</button>
      <button id="retry" type="button" hidden>重试加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">等待 MyTools 就绪…</p>
    <p class="hint">手动保存；保存期间暂停编辑。多个窗口请顺序编辑，避免互相覆盖。</p>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
