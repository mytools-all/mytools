[package]
name = "mytools-core"
version = "0.1.0"
description = "Pure-Rust core logic for MyTools (no Tauri dependency, unit-testable on its own)"
authors = ["MyTools Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher = "0.3"
meval = "0.2"
walkdir = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
tempfile = "3"
